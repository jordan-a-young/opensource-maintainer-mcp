name: Prepare or stage npm packages
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dry run by default; staging requires prior explicit authorization and npm setup
        type: choice
        options: [dry-run, stage]
        default: dry-run
      confirmation:
        description: For authorized staging only, enter stage-reviewed-packages
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate explicit staging authorization and release tag
        if: inputs.mode == 'stage'
        env:
          NPM_STAGING_ENABLED: ${{ vars.NPM_STAGING_ENABLED }}
          CONFIRMATION: ${{ inputs.confirmation }}
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$NPM_STAGING_ENABLED" = true
          test "$CONFIRMATION" = stage-reviewed-packages
          test "$REF_TYPE" = tag
          git merge-base --is-ancestor HEAD origin/main
          python3 scripts/package_release.py --check-tag "$RELEASE_TAG"
  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
  stage:
    if: inputs.mode == 'stage' && vars.NPM_STAGING_ENABLED == 'true'
    needs: [validate, checks]
    environment: npm
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Use npm with trusted and staged publishing support
        run: npm install --global npm@11.16.0 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: npm-dist/tarballs
      - name: Stage with OIDC only; never approve or publish directly
        env:
          NPM_STAGING_ENABLED: ${{ vars.NPM_STAGING_ENABLED }}
          NPM_STAGE_CONFIRMATION: ${{ inputs.confirmation }}
        run: npm --prefix npm run stage:prepared
